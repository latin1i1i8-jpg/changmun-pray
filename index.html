<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>창문아 영상 올려줘 🙏</title>
  <meta name="description" content="창문 유튜버 영상이 올라올 때까지 함께 기도하는 사이트" />
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --accent: #7c5cff;
      --accent-hover: #9578ff;
      --text: #f0f0f5;
      --muted: #9a9aad;
      --success: #3dd68c;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(124, 92, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(61, 214, 140, 0.08) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .count-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .count {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 4px;
      transition: transform 0.15s ease;
    }

    .count.bump {
      transform: scale(1.12);
    }

    .days {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .days strong {
      color: var(--text);
    }

    .pray-btn {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 12px;
    }

    .pray-btn:hover {
      background: var(--accent-hover);
    }

    .pray-btn:active {
      transform: scale(0.97);
    }

    .reset-btn {
      width: 100%;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--success);
      color: var(--success);
      background: rgba(61, 214, 140, 0.08);
    }

    .message {
      margin-top: 20px;
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 1.4em;
      transition: opacity 0.3s;
    }

    .message.show {
      color: var(--accent);
      font-weight: 600;
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.7;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🙏</div>
    <h1>창문아 영상 올려줘</h1>
    <p class="subtitle">
      영상이 올라올 때까지 함께 기도해요.<br />
      버튼을 누를 때마다 기도가 쌓입니다.
    </p>

    <div class="card">
      <div class="count-label">누적 기도 횟수</div>
      <div class="count" id="count">0</div>
      <div class="days" id="days">마지막 영상 이후 <strong id="dayNum">14</strong>일째</div>

      <button class="pray-btn" id="prayBtn">🙏 기도하기</button>
      <button class="reset-btn" id="resetBtn">✨ 영상 올라옴! 초기화</button>

      <div class="message" id="message"></div>
    </div>

    <footer>
      창문 유튜버 팬을 위한 작은 기도 공간 · GitHub Pages
    </footer>
  </div>

  <script>
    // 전 세계 공유 카운터 (무료 API)
    const API = "https://countapi.mileshilliard.com/api/v1";
    const COUNT_KEY = "changmun_pray_total_2026";
    const RESET_KEY = "changmun_pray_last_reset_2026";

    // 기본 시작일: 2026-07-12
    const DEFAULT_START = new Date("2026-07-12T00:00:00").getTime();

    const countEl = document.getElementById("count");
    const dayNumEl = document.getElementById("dayNum");
    const messageEl = document.getElementById("message");
    const prayBtn = document.getElementById("prayBtn");
    const resetBtn = document.getElementById("resetBtn");

    const messages = [
      "창문아 영상 기다려요…",
      "오늘도 기도합니다 🙏",
      "창문 영상 보고 싶어요",
      "조금만 더 기다려볼까요",
      "창문아 보고 싶어",
      "기도가 쌓이고 있어요",
      "창문 유튜브 사랑해요",
      "영상 올라오면 바로 달려갈게요",
      "창문아 화이팅!",
      "함께 기도해요"
    ];

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add("show");
      setTimeout(() => messageEl.classList.remove("show"), 1800);
    }

    function bumpCount() {
      countEl.classList.add("bump");
      setTimeout(() => countEl.classList.remove("bump"), 150);
    }

    function displayCount(n) {
      countEl.textContent = Number(n).toLocaleString("ko-KR");
    }

    // 현재 기도 횟수 불러오기
    async function loadCount() {
      try {
        const res = await fetch(`${API}/get/${COUNT_KEY}`);
        if (res.ok) {
          const data = await res.json();
          displayCount(data.value || 0);
        } else {
          displayCount(0);
        }
      } catch (e) {
        displayCount(0);
      }
    }

    // 마지막 리셋 시간 불러와서 날짜 계산
    async function loadDays() {
      try {
        const res = await fetch(`${API}/get/${RESET_KEY}`);
        let last = DEFAULT_START;
        if (res.ok) {
          const data = await res.json();
          const val = parseInt(data.value, 10);
          if (!isNaN(val) && val > 0) last = val;
        }
        const days = Math.floor((Date.now() - last) / (1000 * 60 * 60 * 24));
        dayNumEl.textContent = Math.max(0, days);
      } catch (e) {
        const days = Math.floor((Date.now() - DEFAULT_START) / (1000 * 60 * 60 * 24));
        dayNumEl.textContent = Math.max(0, days);
      }
    }

    // 기도하기 (+1)
    async function pray() {
      prayBtn.disabled = true;
      try {
        const res = await fetch(`${API}/hit/${COUNT_KEY}`);
        if (res.ok) {
          const data = await res.json();
          displayCount(data.value);
          bumpCount();
          const msg = messages[Math.floor(Math.random() * messages.length)];
          showMessage(msg);
        } else {
          showMessage("잠시 후 다시 시도해주세요");
        }
      } catch (e) {
        showMessage("연결 오류… 다시 눌러봐");
      }
      prayBtn.disabled = false;
    }

    // 초기화 (영상 올라옴)
    async function resetAll() {
      if (!confirm("영상이 올라왔나요?\n전 세계 기도 횟수와 날짜를 초기화합니다.")) return;

      resetBtn.disabled = true;
      try {
        // 기도 횟수 0으로
        await fetch(`${API}/set/${COUNT_KEY}?value=0`);
        // 리셋 시간 저장 (밀리초 타임스탬프)
        await fetch(`${API}/set/${RESET_KEY}?value=${Date.now()}`);

        displayCount(0);
        dayNumEl.textContent = "0";
        showMessage("초기화 완료! 창문아 고마워 ✨");
      } catch (e) {
        showMessage("초기화 실패… 다시 시도해봐");
      }
      resetBtn.disabled = false;
    }

    // 시작
    loadCount();
    loadDays();

    prayBtn.addEventListener("click", pray);
    resetBtn.addEventListener("click", resetAll);

    // 30초마다 최신 횟수 갱신 (다른 사람이 기도한 것 반영)
    setInterval(loadCount, 30000);
    setInterval(loadDays, 60 * 60 * 1000);
  </script>


</body>
</html>
